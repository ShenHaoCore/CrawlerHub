[tool.poetry]
name = "crawlerhub"
version = "0.1.0"
description = "可扩展的多平台爬虫框架"
authors = ["CrawlerHub Contributors"]
readme = "README.md"
packages = [{ include = "crawlerhub" }]

[tool.poetry.dependencies]
python = "^3.10"
httpx = ">=0.27.0"
beautifulsoup4 = ">=4.12.0"
lxml = ">=5.1.0"
pydantic = "^2.6.0"
pyyaml = ">=6.0"
loguru = "^0.7.0"
fake-useragent = ">=1.5.0"
tenacity = ">=8.2.0"
redis = ">=5.0.0"
sqlalchemy = "^2.0.0"

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0.0"
pytest-asyncio = ">=0.23.0"
mypy = ">=1.8.0"
ruff = ">=0.3.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
